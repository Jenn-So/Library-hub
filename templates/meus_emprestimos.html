<!DOCTYPE html>
<html>
<head>
    <title>Meus Empréstimos - Biblioteca</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info p {
            margin: 5px 0;
            font-size: 15px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #c0392b;
        }

        .vazio {
            text-align: center;
            color: #888;
            margin-top: 50px;
            font-size: 18px;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body> 
    <div style="text-align: center; margin-top: 20px;">
        <a href="/meus_emprestimos">📚 Meus Empréstimos</a>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <a href="/logout">Sair</a>
    </div>

    <div class="container">
        <h1>Meus Empréstimos</h1>

        {% if emprestimos %}
            {% for e in emprestimos %}
            <div class="card">
                <div class="info">
                    <p><strong>{{ e.titulo }}</strong></p>
                    <p>{{ e.autor }}</p>
                    <p>Emprestado em: {{ e.data_emprestimo }}</p>
                </div>
                <form method="POST" action="/devolucao/{{ e.id }}">
                    <button type="submit" class="btn">Devolver</button>
                </form>
            </div>
            {% endfor %}
        {% else %}
            <p class="vazio">Você não tem nenhum livro emprestado no momento.</p>
        {% endif %}

        <a href="/catalogo" class="voltar">← Voltar para o catálogo</a>
    </div>
</body>
</html>
