<!DOCTYPE html>
<html>
<head>
    <title>Catálogo - Biblioteca</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .card p {
            margin: 5px 0;
            font-size: 14px;
        }
        .card-link {
            text-decoration: none;
            color: inherit;
}
    </style>
</head>

<body>
    <div style="text-align: center; margin-top: 20px;">
        <a href="/meus_emprestimos">📚 Meus Empréstimos</a>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <a href="/logout">Sair</a>
    </div>


    <div class="container">

        {% for livro in livros %}

        <a href="/livro/{{ livro.id_livro }}" class="card-link">
        <div class="card">
            <h3>{{ livro.titulo }}</h3>
            <p>{{ livro.autor }}</p>
        </div>
        </a>

        {% endfor %}

    </div>
</body>
</html>
