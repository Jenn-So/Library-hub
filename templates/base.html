<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <style>
        :root {
            --amarelo: #f4b400;
            --cinza-claro: #f5f5f5;
            --cinza: #e0e0e0;
            --cinza-escuro: #333;
            --branco: #fff;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--cinza-claro);
        }

        header {
            background: var(--cinza-escuro);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            display: flex;
        }

        aside {
            width: 220px;
            background: var(--cinza);
            padding: 20px;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside li {
            padding: 8px;
        }

        aside li:hover {
            background: var(--amarelo);
            cursor: pointer;
        }

        main {
            flex: 1;
            padding: 20px;
        }

        button {
            padding: 8px;
            border: none;
            border-radius: 5px;
            background: var(--amarelo);
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: var(--amarelo);
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h2>📚 Biblioteca</h2>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/livros">Livros</a>
        <a href="/meus_emprestimos">Empréstimos</a>
        <a href="/logout">Sair</a>
    </div>
</header>

<div class="container">

    <aside>
        <h3>Menu</h3>
        <ul>
            <li><a href="/dashboard">Início</a></li>
            <li><a href="/livros">Livros</a></li>
            <li><a href="/meus_emprestimos">Empréstimos</a></li>
        </ul>
    </aside>

    <main>
        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
