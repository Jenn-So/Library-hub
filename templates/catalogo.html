{% extends "base.html" %}

{% block title %}Catálogo{% endblock %}

{% block content %}

<h1>📚 Catálogo de Livros</h1>

<div class="grid">

    {% for livro in livros %}

    <a href="/livro/{{ livro.id_livro }}" class="card-link">
        <div class="card">
            <h3>{{ livro.titulo }}</h3>
            <p>{{ livro.autor }}</p>
        </div>
    </a>

    {% endfor %}

</div>

{% endblock %}
