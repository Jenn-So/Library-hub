<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 10px;
            background: #f4b400;
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #d99a00;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📚 Biblioteca</h1>
    <p>Gerencie livros, empréstimos e usuários de forma simples.</p>

    <a href="/login" class="btn">Entrar</a>
    <a href="/cadastro" class="btn">Criar conta</a>
</div>

</body>
</html>
